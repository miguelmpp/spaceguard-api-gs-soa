spring.application.name=spaceguard-api

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/spaceguard_api?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

server.error.include-stacktrace=never

api.security.token.secret=${JWT_SECRET:spaceguard-api-local-secret}
api.security.token.issuer=${JWT_ISSUER:spaceguard-api}
api.security.token.expiration-hours=${JWT_EXPIRATION_HOURS:2}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.admin.login=${ADMIN_LOGIN:admin@spaceguard.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}